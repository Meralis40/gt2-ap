# GT2.OVL entry 3 of the Simulation disc, uncompressed. Loads at 0x80010000. See docs/decomp.md.
name: ovl3.bin
sha1: 7f7af7658baac06a4f1ab144edd7db8d48c2563c
options:
  basename: ovl3
  base_path: ..
  target_path: baserom/sim/ovl3.bin
  elf_path: build/sim/ovl3.elf
  platform: psx
  compiler: GCC
  build_path: build/sim
  asm_path: asm/sim/ovl3
  src_path: src/sim/ovl3
  asset_path: assets/sim/ovl3
  ld_script_path: build/sim/ovl3.ld
  symbol_addrs_path: sim/symbols/ovl3.txt
  undefined_funcs_auto_path: build/sim/ovl3.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/sim/ovl3.undefined_syms_auto.txt
  create_undefined_funcs_auto: True
  create_undefined_syms_auto: True
  find_file_boundaries: False
  use_legacy_include_asm: False
  asm_jtbl_label_macro: jlabel
  generate_asm_macros_files: True
  ld_bss_is_noload: True
  disasm_unknown: True
  section_order: [".text", ".rodata", ".data", ".bss"]
  subalign: 4 # GNU as aligns sections to 16; the original sections follow each other at 4
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  string_encoding: ASCII # EUC-JP and Shift-JIS text stays as .word data: as would write it as UTF-8
  data_string_encoding: ASCII
segments:
  - name: ovl3
    type: code
    start: 0x0
    vram: 0x80010000
    subsegments:
      - [0x0, cpp, carwork]    # src/sim/ovl3/carwork.cpp
      - [0x24, asm]
      - [0x1cfc, cpp, minmax]  # src/sim/ovl3/minmax.cpp
      - [0x1d74, asm]
  - [0x2cec]
