    type: code
    start: 0x0
    vram: 0x80010000
    subsegments:
      - [0x0, asm]
      - [0x1ee98, textbin, text_data_8002ee98] # tables inside .text
      - [0x1f92c, asm]
      - [0x36bac, textbin, text_data_80046bac]
      - [0x36fb0, asm]
      - [0x389d8, textbin, text_data_800489d8]
      - [0x38bd8, asm]
      - [0x4a77c, rodata] # 0x8005a77c
  - [0x4d5f8]
