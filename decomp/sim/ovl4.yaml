# GT2.OVL entry 4 of the Simulation disc, uncompressed. Loads at 0x80010000. See docs/decomp.md.
name: ovl4.bin
sha1: 76d3d705ad6e452030f98d15a4a8a3b0f5bdc280
options:
  basename: ovl4
  base_path: ..
  target_path: baserom/sim/ovl4.bin
  elf_path: build/sim/ovl4.elf
  platform: psx
  compiler: GCC
  build_path: build/sim
  asm_path: asm/sim/ovl4
  src_path: src/sim/ovl4
  asset_path: assets/sim/ovl4
  ld_script_path: build/sim/ovl4.ld
  symbol_addrs_path: sim/symbols/ovl4.txt
  undefined_funcs_auto_path: build/sim/ovl4.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/sim/ovl4.undefined_syms_auto.txt
  create_undefined_funcs_auto: True
  create_undefined_syms_auto: True
  find_file_boundaries: False
  use_legacy_include_asm: False
  asm_jtbl_label_macro: jlabel
  generate_asm_macros_files: True
  ld_bss_is_noload: True
  disasm_unknown: True
  section_order: [".text", ".rodata", ".data", ".bss"]
  subalign: 4 # GNU as aligns sections to 16; the original sections follow each other at 4
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  string_encoding: ASCII # EUC-JP and Shift-JIS text stays as .word data: as would write it as UTF-8
  data_string_encoding: ASCII
segments:
  - name: ovl4
    type: code
    start: 0x0
    vram: 0x80010000
    subsegments:
      - [0x0, asm]
      - [0x550, cpp, ../ovl3/minmax] # src/sim/ovl3/minmax.cpp, shared with OVL3
      - [0x714, cpp, ../ovl3/randompick] # src/sim/ovl3/randompick.cpp, shared with OVL3
      - [0x984, cpp, ../ovl3/setcolor] # src/sim/ovl3/setcolor.cpp, shared with OVL3
      - [0xa30, cpp, ../ovl3/initevent] # src/sim/ovl3/initevent.cpp, shared with OVL3
      - [0xf10, cpp, ../ovl3/racesetup] # src/sim/ovl3/racesetup.cpp, shared with OVL3
      - [0x1160, cpp, racestart_clear] # src/sim/ovl4/racestart_clear.cpp, shared with OVL3
      - [0x1184, cpp, racestart_loadparts] # src/sim/ovl4/racestart_loadparts.cpp, shared with OVL3
      - [0x29b8, cpp, racestart_setstages] # src/sim/ovl4/racestart_setstages.cpp, shared with OVL3
      - [0x2c6c, asm]
      - [0x5404, cpp, ../ovl3/carwork] # src/sim/ovl3/carwork.cpp, shared with OVL3
      - [0x5428, cpp, ../ovl3/loadparts] # src/sim/ovl3/loadparts.cpp, shared with OVL3
      - [0x6c5c, cpp, ../ovl3/setstages] # src/sim/ovl3/setstages.cpp, shared with OVL3
      - [0x6f10, cpp, ../ovl3/storesetup] # src/sim/ovl3/storesetup.cpp, shared with OVL3
      - [0x6fec, asm]
      - [0x12964, rodata] # 0x80022964
  - [0x42a74]
