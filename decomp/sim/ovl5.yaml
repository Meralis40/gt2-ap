options:
  basename: ovl5
  base_path: ..
  target_path: baserom/sim/ovl5.bin
  elf_path: build/sim/ovl5.elf
  platform: psx
  compiler: GCC
  build_path: build/sim
  asm_path: asm/sim/ovl5
