# GT2.OVL entry 1 of the Simulation disc, uncompressed. Loads at 0x80010000. See docs/decomp.md.
name: ovl1.bin
sha1: 06158d43bfd520bf565c92cefaf08b4a6df6532b
options:
  basename: ovl1
  base_path: ..
  target_path: baserom/sim/ovl1.bin
  elf_path: build/sim/ovl1.elf
  platform: psx
  compiler: GCC
  build_path: build/sim
  asm_path: asm/sim/ovl1
  src_path: src/sim/ovl1
  asset_path: assets/sim/ovl1
  ld_script_path: build/sim/ovl1.ld
  symbol_addrs_path: sim/symbols/ovl1.txt
  undefined_funcs_auto_path: build/sim/ovl1.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/sim/ovl1.undefined_syms_auto.txt
  create_undefined_funcs_auto: True
  create_undefined_syms_auto: True
  find_file_boundaries: False
  use_legacy_include_asm: False
  asm_jtbl_label_macro: jlabel
  generate_asm_macros_files: True
  ld_bss_is_noload: True
  disasm_unknown: True
  section_order: [".text", ".rodata", ".data", ".bss"]
  subalign: 4 # GNU as aligns sections to 16; the original sections follow each other at 4
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False
  string_encoding: ASCII # EUC-JP and Shift-JIS text stays as .word data: as would write it as UTF-8
  data_string_encoding: ASCII
segments:
  - name: ovl1
    type: code
    start: 0x0
    vram: 0x80010000
    subsegments:
      - [0x0, cpp, minmax] # src/sim/ovl1/minmax.cpp, shared with OVL3
      - [0x1c4, cpp, randompick] # src/sim/ovl1/randompick.cpp, shared with OVL3
      - [0x434, cpp, ../ovl3/setcolor] # src/sim/ovl3/setcolor.cpp, shared with OVL3
      - [0x4e0, cpp, initevent] # src/sim/ovl1/initevent.cpp, shared with OVL3
      - [0x9c0, cpp, racesetup] # 0x800109c0
      - [0xe6c, cpp, ghostfile] # 0x80010e6c, src/sim/ovl4/ghostfile.cpp
      - [0xedc, cpp, racestart] # 0x80010edc
      - [0x10c4, cpp, timload] # 0x800110c4, src/sim/ovl4/timload.cpp
      - [0x10fc, cpp, timupload] # 0x800110fc, src/sim/ovl2/timupload.cpp
      - [0x1178, cpp, mainmenu] # 0x80011178
      - [0x17b4, cpp, negconcalib] # 0x800117b4, src/sim/exe/negconcalib.cpp
      - [0x1868, cpp, timload2] # 0x80011868, src/sim/ovl4/timload.cpp and src/sim/ovl2/timupload.cpp
      - [0x191c, cpp, basemenu] # 0x8001191c
      - [0x24a4, cpp, replaypages] # 0x800124a4
      - [0x3230, cpp, replaycopy] # 0x80013230
      - [0x6254, cpp, mainstrings] # 0x80016254
      - [0x6394, cpp, menusprite] # 0x80016394
      - [0x69b0, cpp, autoload] # 0x800169b0
      - [0x721c, cpp, langselect] # 0x8001721c
      - [0x7720, cpp, timupload2] # 0x80017720, src/sim/ovl2/timupload.cpp
      - [0x779c, cpp, mainmenupage] # 0x8001779c
      - [0x7d74, cpp, options] # 0x80017d74
      - [0x9218, cpp, keyconfig] # 0x80019218
      - [0xaad4, cpp, analogsettings] # 0x8001aad4
      - [0xd4b0, cpp, tabselector] # 0x8001d4b0
      - [0xda08, cpp, datatransfer] # 0x8001da08
      - [0xe808, cpp, buycar] # 0x8001e808
      - [0xf508, cpp, dataxfer] # 0x8001f508
      - [0x10dcc, cpp, demoreplay] # 0x80020dcc
      - [0x10f2c, rodata] # 0x80020f2c
      - [0x11004, .rodata, racestart] # Race_PrepareStart's jump table
      - [0x11030, rodata]
      - [0x11034, .rodata, mainmenu] # MainMenu_Run's jump table
      - [0x11050, rodata]
      - [0x11054, .rodata, basemenu] # 0x80021054: Update's jump table, vtable and type name of BaseMenu
      - [0x110bc, rodata]
      - [0x12bdc, .rodata, autoload] # 0x80022bdc: AutoLoad_Update's jump table
      - [0x12c08, rodata]
      - [0x12c0c, .rodata, langselect] # 0x80022c0c: LangSelect_ItemCallback's jump table
      - [0x12c30, rodata]
      - [0x12c5c, .rodata, options] # 0x80022c5c: the jump tables of Option_Get and Option_Set
      - [0x12cd8, rodata] # 0x80022cd8, from the padding after options.cpp's .rodata
  - [0x3c8c4]
